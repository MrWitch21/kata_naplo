<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katanapló – számlák és KATA-adó</title>
    <meta
      name="description"
      content="Számlanyilvántartás és adókalkulátor kisadózóknak, a 2027-es új KATA szabályaival."
    />
    <script>
      try {
        var t = localStorage.getItem('katanaplo:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
